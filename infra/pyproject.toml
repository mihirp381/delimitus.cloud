[project]
name = "ssc-infra"
version = "0.0.1"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pulumi==3.263.0",
  "pulumi-gcp==9.37.0",
  "ssc-contracts",
  "ssc-shared[gcs]",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.1,<2"]

[tool.uv]
required-version = ">=0.12,<0.13"
exclude-newer = "2026-09-21T00:00:00Z"
exclude-newer-package = { pyjwt = "2026-09-24T00:00:00Z" }
package = false

[tool.uv.sources]
ssc-contracts = { path = "../packages/ssc_contracts", editable = true }
ssc-shared = { path = "../packages/ssc_shared", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "tests"]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["ssc_infra", "tests", "__main__.py"]
strict = ["ssc_infra"]
reportMissingImports = true
