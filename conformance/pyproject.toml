[project]
name = "ssc-conformance"
version = "0.0.1"
requires-python = ">=3.14,<3.15"
dependencies = ["ssc-contracts", "ssc-shared[gcs]", "ssc-edge", "ssc-control", "ssc-agent", "pyjwt[crypto]==2.15.0", "cryptography==50.0.1", "httpx2==2.13.0", "pytest>=8.4,<10"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ssc_conformance"
module-root = ""

[tool.deptry]
known_first_party = ["ssc_contracts", "ssc_shared", "ssc_bundle", "ssc_control", "ssc_edge", "ssc_datagw", "ssc_egress", "ssc_cli", "ssc_app", "ssc_agent", "ssc_conformance", "checks"]  # checks: the probe image's own module
ignore = ["DEP002", "DEP004"]  # DEP002 re-enabled in SSC-011 once packages hold real code
