name: kill-drill

# SSC-054: the kill switch drill against the drill app in a staging cell (docs/kill-switch-drill.md).
# Inert until its settings exist: the job runs only on main and only once the repository variable
# SSC_DRILL_API_URL is set. Variables: SSC_DRILL_API_URL, SSC_DRILL_APP_ID, SSC_DRILL_ENV_ID,
# SSC_DRILL_HOST, SSC_DRILL_PROJECT, SSC_DRILL_ORG_ID, SSC_DRILL_USER, SSC_DRILL_WIF_PROVIDER,
# SSC_DRILL_SERVICE_ACCOUNT, and optionally SSC_DRILL_RUNS. Secrets: SSC_DRILL_TOKEN (an admin's
# access token) and SSC_DRILL_KEYRING (the cell's session keyring JSON).

# The job runs by hand only (workflow_dispatch). A drill takes about 5 hours, so SSC_DRILL_TOKEN
# must outlive the run, and there is no long-lived control plane credential yet: the weekly
# schedule below stays commented out until a machine credential exists for the drill. The Google
# identity named in SSC_DRILL_SERVICE_ACCOUNT must trust this file.
on:
  # schedule: [{ cron: "23 2 * * 0" }]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kill-drill
  cancel-in-progress: false

env:
  UV_FROZEN: "1"

jobs:
  drill:
    if: github.ref == 'refs/heads/main' && vars.SSC_DRILL_API_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false
      - run: uv sync --all-packages --locked
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.SSC_DRILL_WIF_PROVIDER }}
          service_account: ${{ vars.SSC_DRILL_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: The drill
        env:
          SSC_DRILL_API_URL: ${{ vars.SSC_DRILL_API_URL }}
          SSC_DRILL_APP_ID: ${{ vars.SSC_DRILL_APP_ID }}
          SSC_DRILL_ENV_ID: ${{ vars.SSC_DRILL_ENV_ID }}
          SSC_DRILL_HOST: ${{ vars.SSC_DRILL_HOST }}
          SSC_DRILL_PROJECT: ${{ vars.SSC_DRILL_PROJECT }}
          SSC_DRILL_ORG_ID: ${{ vars.SSC_DRILL_ORG_ID }}
          SSC_DRILL_USER: ${{ vars.SSC_DRILL_USER }}
          SSC_DRILL_RUNS: ${{ vars.SSC_DRILL_RUNS }}
          SSC_DRILL_TOKEN: ${{ secrets.SSC_DRILL_TOKEN }}
          SSC_DRILL_KEYRING: ${{ secrets.SSC_DRILL_KEYRING }}
        run: uv run python -m ssc_conformance.kill_drill
