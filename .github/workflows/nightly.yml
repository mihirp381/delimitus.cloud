name: nightly

# SSC-017: the runtime probes and the drift repair, in the staging probe cell. GitHub's OIDC token
# becomes ssc-nightly (decision 022) only for this file on main; it may mint the control plane's
# ID tokens for the cell agent, run the probe job, and read that job's logs.

# The schedule is off while no probe cell exists (`c-probecell01` destroyed 2026-10-02 to stop its
# cost). Deleted project IDs are not reused: after creating the probe cell of SSC-086 under a new
# label and setting SSC_NIGHTLY_WIF_PROVIDER, SSC_PROBE_PROJECT, SSC_PROBE_AGENT_URL and
# SSC_PROBE_DIGEST, uncomment the schedule line below. With one cell, cannot_reach_peer_cell
# reports skipped (no peer cell), which does not fail the run.
on:
  # schedule: [{ cron: "17 6 * * *" }]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  UV_FROZEN: "1"

jobs:
  runtime-probes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false
      - run: uv sync --all-packages --locked
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.SSC_NIGHTLY_WIF_PROVIDER }}
          service_account: ssc-nightly@ssc-control-staging.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Probes and drift repair
        env:
          SSC_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SSC_PROBE_PROJECT: ${{ vars.SSC_PROBE_PROJECT }}
          SSC_PROBE_AGENT_URL: ${{ vars.SSC_PROBE_AGENT_URL }}
          SSC_PROBE_DIGEST: ${{ vars.SSC_PROBE_DIGEST }}
          SSC_CONTROL_SA: ssc-control@ssc-control-staging.iam.gserviceaccount.com
        run: uv run python -m ssc_conformance.nightly
