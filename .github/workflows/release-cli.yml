# Publishes ssc-cli and the three packages it depends on to PyPI with trusted publishing.
# Off until the founder sets the repository variable SSC_PUBLISH_ENABLED=true (decision 017).
name: release-cli

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cli
  cancel-in-progress: false

env:
  UV_FROZEN: "1"

jobs:
  build:
    name: Build distributions
    if: vars.SSC_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
      # One version for the four packages, each pinning the others to it, and the tag naming it.
      - name: Check versions, pins and tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: uv run --no-project --python 3.14 python tools/release_versions.py --tag "$RELEASE_TAG"
      - run: uv build --package ssc-contracts --out-dir dist
      - run: uv build --package ssc-shared --out-dir dist
      - run: uv build --package ssc-bundle --out-dir dist
      - run: uv build --package ssc-cli --out-dir dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # One environment per package: PyPI registers a trusted publisher once per repository, workflow
  # and environment, so four new projects need four environments. Dependencies go first.
  publish:
    name: Publish ${{ matrix.package }} to PyPI
    if: vars.SSC_PUBLISH_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      max-parallel: 1
      matrix:
        package: [contracts, shared, bundle, cli]
    environment: pypi-${{ matrix.package }}
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Keep only this package's files
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          find dist -type f ! -name "ssc_${PACKAGE}-*" -delete
          ls dist
          test "$(ls dist | wc -l)" -eq 2
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
