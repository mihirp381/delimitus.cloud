name: isolation-nightly

# SSC-029: the browser isolation suite against a staging cell (e2e/isolation, README), with the
# cases the Docker run skips: the gateway's run.app host, two cells and the 60-minute limit.
# Inert until its settings exist: the job runs only on main and only once the repository
# variable SSC_ISO_CELL1_BASE is set. Variables: SSC_ISO_CELL1_BASE, SSC_ISO_AUTH_URL,
# SSC_ISO_CELL1_ORG, SSC_ISO_USER, SSC_ISO_OTHER_USER, SSC_ISO_OUTSIDER, and optionally
# SSC_ISO_CELL2_BASE, SSC_ISO_GATEWAY_RUN_APP and SSC_ISO_LIMIT_SECONDS. Secrets:
# SSC_ISO_CELL1_KEYRING (the cell's session keyring JSON, to seal sessions while the auth host is
# not deployed) and optionally SSC_ISO_AUTH_STATE (a Playwright storage state signed in to the
# auth host as SSC_ISO_USER). No cloud credentials: the suite only browses the cell.
on:
  schedule: [{ cron: "41 3 * * *" }]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolation-nightly
  cancel-in-progress: false

env:
  UV_FROZEN: "1"

jobs:
  live:
    if: github.ref == 'refs/heads/main' && vars.SSC_ISO_CELL1_BASE != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        working-directory: e2e/isolation
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false
      - run: uv sync --all-packages --locked
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Recorded auth host session
        env:
          AUTH_STATE: ${{ secrets.SSC_ISO_AUTH_STATE }}
        run: |
          if [ -n "$AUTH_STATE" ]; then
            umask 077
            printf '%s' "$AUTH_STATE" > "$RUNNER_TEMP/auth-state.json"
            echo "SSC_ISO_AUTH_STATE=$RUNNER_TEMP/auth-state.json" >> "$GITHUB_ENV"
          fi
      - name: The suite against the staging cell
        env:
          SSC_ISO_CELL1_BASE: ${{ vars.SSC_ISO_CELL1_BASE }}
          SSC_ISO_CELL2_BASE: ${{ vars.SSC_ISO_CELL2_BASE }}
          SSC_ISO_AUTH_URL: ${{ vars.SSC_ISO_AUTH_URL }}
          SSC_ISO_CELL1_ORG: ${{ vars.SSC_ISO_CELL1_ORG }}
          SSC_ISO_USER: ${{ vars.SSC_ISO_USER }}
          SSC_ISO_OTHER_USER: ${{ vars.SSC_ISO_OTHER_USER }}
          SSC_ISO_OUTSIDER: ${{ vars.SSC_ISO_OUTSIDER }}
          SSC_ISO_GATEWAY_RUN_APP: ${{ vars.SSC_ISO_GATEWAY_RUN_APP }}
          SSC_ISO_LIMIT_SECONDS: ${{ vars.SSC_ISO_LIMIT_SECONDS }}
          SSC_ISO_CELL1_KEYRING: ${{ secrets.SSC_ISO_CELL1_KEYRING }}
          SSC_ISO_NIGHTLY: "1"
        run: npm run live
      - name: Clear the recorded session
        if: always()
        run: rm -f "$RUNNER_TEMP/auth-state.json"
