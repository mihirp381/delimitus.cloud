[project]
name = "ssc-proofrun"
version = "0.0.1"
description = "SSC-086 proof-run kit: one command per proof, each ending in a number and a pass or fail"
requires-python = ">=3.14"
dependencies = [
    "websockets==17.1",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
]

[tool.uv]
exclude-newer = "2026-09-21T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["apps", "standins"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "ASYNC", "T20", "PL"]
ignore = ["PLR2004", "S101", "T201"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PL"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proofrun"]
