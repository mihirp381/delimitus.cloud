[project]
name = "ssc-appdb-spike"
version = "0.0.1"
description = "SSC-005 spike: per-app database creation and driver check"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]==3.3.6",
    "httpx2==2.13.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "asyncpg==0.31.0",
    "django==6.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["appdb"]
