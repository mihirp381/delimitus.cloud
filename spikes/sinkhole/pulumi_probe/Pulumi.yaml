name: ssc-exp091p
description: SSC-091 probe. N DNS response policy rules shaped like the cell's sinkhole rules, to find where Pulumi spends the time. Run by spikes/sinkhole/pulumi_probe/run.py only.
runtime:
  name: python
  options:
    # Pulumi's uv toolchain creates .venv here from pyproject.toml and uv.lock (the same pulumi and
    # pulumi-gcp as infra/uv.lock). The pip toolchain needs pip in the venv, which uv's has not.
    toolchain: uv
