[project]
name = "ssc-datagw"
version = "0.0.1"
requires-python = ">=3.14,<3.15"
dependencies = [
    "ssc-contracts",
    "ssc-shared[gcs]",
    "google-api-core==2.38.0",
    "google-auth==2.58.0",
    "fastapi==0.141.1",
    "uvicorn==0.38.0",
    "asyncpg==0.31.0",
    "sqlglot==28.0.0",
    "httpx2==2.13.0",
    "pyjwt[crypto]==2.15.0",
    "pydantic==2.13.5",
    "asyncmy==0.2.14",
    "python-tds==1.17.1",
    "pyopenssl==26.4.0",
    "cryptography==50.0.1",
    "dnspython==2.8.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.deptry]
known_first_party = ["ssc_contracts", "ssc_shared", "ssc_bundle", "ssc_control", "ssc_edge", "ssc_datagw", "ssc_egress", "ssc_cli", "ssc_app", "ssc_conformance"]
ignore = ["DEP002", "DEP004"]  # DEP002 re-enabled in SSC-011 once packages hold real code
