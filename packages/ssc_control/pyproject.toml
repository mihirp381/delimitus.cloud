[project]
name = "ssc-control"
version = "0.0.1"
requires-python = ">=3.14,<3.15"
dependencies = ["ssc-contracts", "ssc-shared", "ssc-bundle", "fastapi==0.141.1", "pydantic==2.13.5", "uvicorn==0.38.0", "sqlalchemy[asyncio]==2.0.54", "psycopg[binary]==3.3.6", "alembic==1.20.0", "procrastinate==3.10.0", "pyjwt[crypto]==2.15.0", "httpx2==2.13.0", "cronsim==2.7", "mcp==2.2.0"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.deptry]
known_first_party = ["ssc_contracts", "ssc_shared", "ssc_bundle", "ssc_control", "ssc_edge", "ssc_datagw", "ssc_egress", "ssc_cli", "ssc_app", "ssc_conformance"]
ignore = ["DEP004"]  # dev-only imports in tests (pytest, testcontainers)

[tool.deptry.per_rule_ignores]
# Workspace packages are in known_first_party, so deptry cannot see them being used.
# Pinned by SSC-007 for tickets that have not landed: uvicorn (serving, SSC-013), cronsim
# (schedules, SSC-045), httpx2 (outbound calls, SSC-016/SSC-047).
DEP002 = [
  "ssc-contracts", "ssc-shared", "ssc-bundle",
  "uvicorn", "cronsim", "httpx2",
]
# Tests generate a throwaway ES256 key with cryptography, which pyjwt[crypto] already brings.
# api/problems.py handles starlette's HTTPException (what the router raises for 404 and 405;
# FastAPI's subclass would miss it); starlette's version is fixed by the fastapi pin.
DEP003 = ["cryptography", "starlette"]
