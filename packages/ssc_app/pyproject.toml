[project]
name = "ssc-app"
version = "0.0.1"
description = "The helper an app on Small Software Cloud installs: who is signed in, streams that reconnect, files and company data."
readme = "README.md"
# An app runs on the Python it chose and holds its own pins, so these are ranges; CI job
# python-helper installs the wheel alone at both ends of them. PyJWT starts at the release the
# workspace pins for its security fixes.
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5,<3", "pyjwt[crypto]>=2.15.0,<3"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.deptry]
known_first_party = ["ssc_contracts", "ssc_shared", "ssc_bundle", "ssc_control", "ssc_edge", "ssc_datagw", "ssc_egress", "ssc_cli", "ssc_app", "ssc_conformance"]
ignore = ["DEP002", "DEP004"]  # DEP002 re-enabled in SSC-011 once packages hold real code
